<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stand tab hidden</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f7f7f8; color: #1d1d1b;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
    strong { font: 600 56px ui-monospace, Menlo, monospace; display: block; }
  </style>
</head>
<body>
  <main>
    <p>The stand tab is hidden now.</p>
    <strong id="left">10</strong>
    <p>This tab closes itself; if it does not, switch back to the stand tab.</p>
  </main>
  <script>
    let left = 10;
    const el = document.getElementById("left");
    const timer = setInterval(() => {
      left -= 1;
      el.textContent = String(left);
      if (left <= 0) {
        clearInterval(timer);
        window.close();
      }
    }, 1000);
  </script>
</body>
</html>
